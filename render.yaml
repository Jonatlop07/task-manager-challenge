services:
  - type: web
    name: task-manager-api-go-pass
    runtime: node
    plan: free
    region: oregon
    rootDir: task-manager-backend
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: pnpm run migration:run:prod && pnpm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db-go-pass
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: CORS_ORIGINS
        value: https://task-manager-ui-go-pass.onrender.com

  - type: web
    name: task-manager-ui-go-pass
    runtime: static
    rootDir: task-manager-ui
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://task-manager-api-go-pass.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: task-manager-db-go-pass
    plan: free
    region: oregon
    databaseName: task_manager
    user: task_manager
